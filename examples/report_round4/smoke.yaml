model_id: mistralai/Timestral-5M
revision: bdd20cfc15a3fea0e4cb5ccef37f8d3ca7aa335f
train_data: runs/report-round4-example-data/train.parquet
validation_data: runs/report-round4-example-data/validation.parquet
output_dir: runs/report-round4-example
data:
  time_column: date
  target_columns: [HUFL, HULL, MUFL, MULL, LUFL, LULL, OT]
  frequency: h
training:
  mode: lora
  device: cpu
  training_strategy: dhf
  loss_space: normalized
  validation_loss_space: history_scaled
  context_length: 256
  prediction_length: 192
  max_steps: 4
  batch_size: 2
  gradient_accumulation: 1
  eval_every: 2
  warmup_steps: 1
  seed: 42
  num_threads: 2
  synthetic:
    version: 1
    trend_scale: 1.0
    seasonal_scale: 1.0
    noise_scale: 0.2
    shift_probability: 0.5
    event_probability: 0.5
    count_probability: 0.2
    nonlinear_probability: 0.5
    dependency_strength: 0.5
    min_period: 8.0
    max_period: 128.0
  stages:
    - steps: 2
      context_length: 128
      synthetic_probability: 1.0
    - steps: 2
      context_length: 256
      synthetic_probability: 0.5
